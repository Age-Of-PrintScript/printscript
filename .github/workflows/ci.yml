name: PR-Check
on:
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-22.04

        steps:
            - name: Clone repository
              uses: actions/checkout@v4

            # 1. Instala la versión de Java requerida por el proyecto
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'

            # 2. Cachea dependencias de Gradle para acelerar builds
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            # 3. Asegura permisos de ejecución en Linux
            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            # El coverage deberia ser habilitado mas tarde
            - name: Run checks (Tests, Linter, Detekt, Coverage)
              run: ./gradlew check -x jacocoTestCoverageVerification
